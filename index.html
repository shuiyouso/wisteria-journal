<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#70518c"><meta name="description" content="收藏日常的小小幸福，也留存西格的话与内心想法。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>紫藤花语</title>
<style>
:root{color-scheme:light;--ink:#352b3d;--muted:#817689;--line:#e9dfed;--lav:#f3edf8;--deep:#70518c;--rose:#b987a9;--gold:#a77b54}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#f7eff9,#fffaf8 58%,#f5eff8);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Noto Sans SC",sans-serif}header{padding:27px 20px 24px;background:linear-gradient(135deg,#67477f,#a17aa9);color:white;border-radius:0 0 28px 28px}header .eyebrow{font-size:11px;letter-spacing:.16em;opacity:.85}h1{font-size:27px;margin:5px 0 3px}header p{font-size:13px;margin:0;opacity:.92}main{max-width:720px;margin:auto;padding:15px 14px 40px}.welcome{padding:13px 15px;margin-top:13px;background:#ffffffc9;border:1px solid var(--line);border-radius:16px;color:#695d70;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.tab{border:1px solid #e5d9eb;background:#fff;color:#6d5c76;border-radius:15px;padding:13px 8px;font-weight:650}.tab.active{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 5px 15px #70518c30}.tab small{display:block;font-weight:400;font-size:11px;opacity:.85}.stats{display:flex;gap:10px}.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}.stat strong{display:block;font-size:21px;color:var(--deep)}.stat span{font-size:11px;color:var(--muted)}.panel{background:#ffffffed;border:1px solid var(--line);border-radius:19px;padding:15px;margin-top:13px;box-shadow:0 5px 20px #4c326008}h2{font-size:17px;margin:0 0 10px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#65596c;margin-bottom:5px}input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #ded3e5;border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:124px;resize:vertical}button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:#fff;color:var(--ink);cursor:pointer;min-height:42px}button.primary{background:var(--deep);color:white;border-color:var(--deep)}button.soft{background:var(--lav);color:var(--deep);border-color:#e6d8ee}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar h2{flex:1;margin:0}.toolbar input{flex:1;min-width:135px}.entry{padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry summary{list-style:none;cursor:pointer}.entry summary::-webkit-details-marker{display:none}.entry summary:after{content:'展开 ›';float:right;color:var(--deep);font-size:12px}.entry[open] summary:after{content:'收起⌃'}.entry h3{font-size:16px;margin:0;display:inline}.date{font-size:12px;color:var(--muted);margin:3px 0 8px}.preview{font-size:13px;color:#766b7b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:10px}.entry-actions{display:flex;gap:7px;margin-top:10px}.entry-actions button{font-size:12px;padding:5px 10px;min-height:34px}.hint{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:23px 10px;color:var(--muted);font-size:14px}.hidden{display:none!important}.backup-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.backup-row button{font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 8px}.tag{display:inline-block;background:#f5eff8;color:#765b87;border-radius:20px;padding:2px 8px;font-size:11px;margin-right:6px}.subtabs{display:flex;gap:8px;margin:10px 0 4px}.subtabs button{flex:1;font-size:13px}.subtabs button.active{background:#f4edf8;border-color:#cdb9da;color:#68477e}.loadmore{width:100%;margin-top:10px}.quote-entry{border-left:3px solid #c8a77e;padding-left:12px}.quote-entry h3{color:#73573d}
</style></head><body>
<header><div class="eyebrow">A LITTLE PLACE FOR WHAT MATTERS</div><h1>紫藤花语 ✿</h1><p>把日常的幸福收好，也把想珍藏的话留在这里。</p></header>
<main><div class="welcome">生活里的小小幸福，和西格的话与内心想法，都可以在这里慢慢收藏。</div>
<nav class="tabs" aria-label="记录空间"><button class="tab active" id="tabHappy" type="button">✿ 幸福收藏<small>生活里值得纪念的小事</small></button><button class="tab" id="tabWords" type="button">♡ 西格的话 · 西格的内心<small>他说的话，也有他的内心想法</small></button></nav>
<div class="stats"><div class="stat"><strong id="count">0</strong><span id="countLabel">件小小幸福</span></div><div class="stat"><strong id="latest">—</strong><span>最近记录</span></div></div>
<section class="panel" id="editor"><h2 id="formTitle">收藏一件开心的小事</h2><form id="form"><div class="field hidden" id="kindField"><label for="kind">这次想记录</label><select id="kind"><option value="spoken">西格说的话</option><option value="thought">西格的内心想法</option></select></div><div class="field"><label id="titleLabel" for="title">给这件小事起个名字</label><input id="title" maxlength="80" required placeholder="例如：今天阳光很好，心情也很好"></div><div class="field"><label id="bodyLabel" for="body">把那一刻写下来</label><textarea id="body" maxlength="10000" required placeholder="不必是大事，只要它让你觉得开心，就值得被记住。"></textarea></div><div class="field"><label for="date">日期和时间</label><input id="date" type="datetime-local" required></div><div class="actions"><button class="primary" id="save" type="submit">✿ 收进幸福收藏</button><button class="soft hidden" id="cancel" type="button">取消编辑</button></div></form><p id="status" class="hint" role="status" aria-live="polite">点击保存后，记录会立即出现在下方列表中，并保存在这台设备。</p></section>
<section class="panel"><div class="toolbar"><h2 id="listTitle">幸福时间轴</h2><input id="search" aria-label="搜索记录" placeholder="搜索标题或回忆…"></div><div class="subtabs hidden" id="wordFilters"><button class="active" data-filter="all">全部</button><button data-filter="spoken">西格说的话</button><button data-filter="thought">西格的内心想法</button></div><div id="entries"></div><button class="soft loadmore hidden" id="loadMore">查看更早的记录</button></section>
<section class="panel"><h2 id="backupTitle">幸福收藏 · 独立备份</h2><p class="hint" id="backupHint">随时导出当前空间的全部记录。导入备份会替换当前空间，不会影响另一个空间。</p><div class="backup-row"><button class="soft" id="export">↓ 导出幸福收藏</button><button class="soft" id="import">↑ 导入幸福收藏</button><input class="hidden" id="file" type="file" accept="application/json,.json"></div><p class="hint" id="backupStatus" aria-live="polite"></p></section>
<footer>愿每一件小小的幸福，都有地方安放。<br>记录只保存在当前设备浏览器中；请定期导出备份。</footer></main>
<script>
const DB='wisteria-happiness-db',HAPPY='entries',WORDS='sig_words';let db,space='happy',editing=null,items=[],filter='all',visible=10;const $=id=>document.getElementById(id);
const config={happy:{store:HAPPY,count:'件小小幸福',form:'收藏一件开心的小事',titleLabel:'给这件小事起个名字',titlePh:'例如：今天阳光很好，心情也很好',bodyLabel:'把那一刻写下来',bodyPh:'不必是大事，只要它让你觉得开心，就值得被记住。',save:'✿ 收进幸福收藏',list:'幸福时间轴',backup:'幸福收藏 · 独立备份',export:'↓ 导出幸福收藏',import:'↑ 导入幸福收藏',empty:'还没有收藏。今天有没有一件小事，让你觉得开心？',tag:'幸福小事'},words:{store:WORDS,count:'段想珍藏的记录',form:'留下一段西格的记录',titleLabel:'给这段记录一个标题',titlePh:'例如：他说“就在这里”',bodyLabel:'记录内容',bodyPh:'可以尽量记下原话，也可以写下你感受到的内心想法、当时的情境和感受。',save:'♡ 收藏这段记录',list:'西格的话 · 西格的内心',backup:'西格的话与内心 · 独立备份',export:'↓ 导出西格的记录',import:'↑ 导入西格的记录',empty:'这里还空着。遇到想珍藏的话或想法，再慢慢写下来。',tag:'西格的记录'}};
function nowLocal(){let d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,16)}function niceDate(v){return (v||'').replace('T',' ')}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(HAPPY))d.createObjectStore(HAPPY,{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains(WORDS))d.createObjectStore(WORDS,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((resolve,reject)=>{let r=db.transaction(config[space].store).objectStore(config[space].store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function write(mode,fn){return new Promise((resolve,reject)=>{let t=db.transaction(config[space].store,mode);fn(t.objectStore(config[space].store));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function reset(){ $('form').reset();$('date').value=nowLocal();$('formTitle').textContent=config[space].form;$('save').textContent=config[space].save;$('cancel').classList.add('hidden');editing=null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){items=await all();items.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);$('count').textContent=items.length;$('latest').textContent=items[0]?.date?(items[0].date.slice(5,10)):'—';render()}
function render(){let q=$('search').value.trim().toLowerCase(),c=config[space],a=items.filter(x=>(x.title+' '+x.body).toLowerCase().includes(q));if(space==='words'&&filter!=='all')a=a.filter(x=>(x.kind||'spoken')===filter);let shown=a.slice(0,visible);$('entries').innerHTML=shown.length?shown.map(x=>`<details class="entry ${space==='words'?'quote-entry':''}"><summary><span class="tag">${space==='words'?((x.kind||'spoken')==='thought'?'西格的内心想法':'西格说的话'):c.tag}</span><h3>${esc(x.title)}</h3><div class="date">${esc(niceDate(x.date))}</div><div class="preview">${esc(x.body.slice(0,90))}${x.body.length>90?'…':''}</div></summary><div class="body">${esc(x.body)}</div><div class="entry-actions"><button class="soft" data-edit="${x.id}">编辑</button><button data-del="${x.id}">删除</button></div></details>`).join(''):`<div class="empty">${c.empty}</div>`;$('loadMore').classList.toggle('hidden',a.length<=visible);$('loadMore').textContent=`查看更早的记录（还有 ${Math.max(0,a.length-visible)} 条）`}
function switchSpace(next){if(space===next)return;space=next;editing=null;filter='all';visible=10;$('tabHappy').classList.toggle('active',space==='happy');$('tabWords').classList.toggle('active',space==='words');let c=config[space];$('countLabel').textContent=c.count;$('formTitle').textContent=c.form;$('titleLabel').textContent=c.titleLabel;$('title').placeholder=c.titlePh;$('bodyLabel').textContent=c.bodyLabel;$('body').placeholder=c.bodyPh;$('save').textContent=c.save;$('listTitle').textContent=c.list;$('backupTitle').textContent=c.backup;$('export').textContent=c.export;$('import').textContent=c.import;$('kindField').classList.toggle('hidden',space!=='words');$('wordFilters').classList.toggle('hidden',space!=='words');$('search').value='';$('backupStatus').textContent='';$('wordFilters').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));reset();refresh()}
$('tabHappy').onclick=()=>switchSpace('happy');$('tabWords').onclick=()=>switchSpace('words');$('search').oninput=()=>{visible=10;render()};$('cancel').onclick=reset;$('loadMore').onclick=()=>{visible+=10;render()};$('wordFilters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;visible=10;$('wordFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('form').onsubmit=async e=>{e.preventDefault();let item={title:$('title').value.trim(),body:$('body').value.trim(),date:$('date').value||nowLocal(),updatedAt:new Date().toISOString()};if(!item.title||!item.body)return;if(space==='words')item.kind=$('kind').value;if(editing!==null){item.id=editing;await write('readwrite',s=>s.put(item))}else await write('readwrite',s=>s.add(item));reset();visible=10;await refresh();$('status').textContent='已经保存好了，记录就在下面。可以继续写下一条。'};
$('entries').onclick=async e=>{let ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){let x=items.find(y=>y.id===Number(ed.dataset.edit));if(!x)return;editing=x.id;$('title').value=x.title;$('body').value=x.body;$('date').value=(x.date||nowLocal()).slice(0,16);if(space==='words')$('kind').value=x.kind||'spoken';$('formTitle').textContent='编辑这条记录';$('save').textContent='保存修改';$('cancel').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}if(del){let id=Number(del.dataset.del);if(confirm('确定删除这条记录吗？此操作无法撤销。')){await write('readwrite',s=>s.delete(id));await refresh();$('status').textContent='这条记录已删除。'}}};
function download(name,data){let u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$('export').onclick=async()=>{let arr=await all(),label=space==='happy'?'幸福收藏':'西格的话与内心',payload={app:'紫藤花语',space,version:3,exportedAt:new Date().toISOString(),entries:arr};download(`紫藤花语_${label}_${nowLocal().slice(0,10)}.json`,JSON.stringify(payload,null,2));$('backupStatus').textContent=`已导出当前空间的 ${arr.length} 条记录。请把备份文件妥善保存。`};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),arr=d.entries;if(!Array.isArray(arr)||arr.length>20000||!arr.every(x=>x&&typeof x.title==='string'&&typeof x.body==='string'&&typeof x.date==='string'))throw Error('bad');let expected=space==='happy'?'happy':'words';if(d.space&&d.space!==expected)throw Error('space');if(!confirm(`备份中有 ${arr.length} 条记录。导入会替换「${space==='happy'?'幸福收藏':'西格的话与内心'}」当前的全部记录，不影响另一个空间。继续吗？`))return;await write('readwrite',s=>s.clear());for(let x of arr)await write('readwrite',s=>s.add({title:x.title.slice(0,80),body:x.body.slice(0,10000),date:x.date,kind:x.kind||'spoken',updatedAt:x.updatedAt||new Date().toISOString()}));await refresh();$('backupStatus').textContent='导入成功，记录已恢复。'}catch(err){$('backupStatus').textContent=err.message==='space'?'这是另一个空间的备份，请切换到对应空间再导入。':'文件无法识别，请选择紫藤花语导出的 JSON 备份。'}finally{e.target.value=''}};
(async()=>{try{db=await openDB();$('date').value=nowLocal();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){$('status').textContent='本机存储暂不可用，请使用支持 IndexedDB 的现代浏览器。'}})();
</script></body></html>
