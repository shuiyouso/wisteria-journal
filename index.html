<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紫藤花语 · Wisteria Journal</title>
<meta name="description" content="私人的幸福收藏、西格的话与心情花笺。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="theme-color" content="#7a5c94">
<link rel="stylesheet" href="assets/css/style.css">
<script>
/* 清理旧站遗留的 Service Worker 与缓存，避免浏览器一直显示旧页面 */
(function () {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (list) {
        list.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="mark">✿</span>
      <div>
        <h1>紫藤花语</h1>
        <p class="sub">把日常的幸福收好，也把想珍藏的话留在这里。</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/home" data-view="home">首页</a>
      <a href="#/happy" data-view="happy">幸福收藏</a>
      <a href="#/words" data-view="words">西格的话</a>
      <a href="#/mood" data-view="mood">心情花笺</a>
      <a href="#/backup" data-view="backup">备份</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <!-- 首页 -->
  <section class="view" id="view-home">
    <div class="stats" id="stats"></div>
    <div class="cards" id="homeCards"></div>
    <div class="panel">
      <div class="panel-head">
        <h2>最近记录</h2>
        <span class="hint">最近更新的 5 条</span>
      </div>
      <div id="recentList"></div>
    </div>
    <p class="note">记录只保存在当前设备的浏览器里。清理浏览器数据、更换设备或浏览器故障都可能造成丢失，请定期到「备份」导出。</p>
  </section>

  <!-- 通用浏览视图（幸福收藏 / 西格的话 / 心情花笺共用） -->
  <section class="view" id="view-list">
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题、正文、标签、关键词">
      <button class="primary" id="btnNew">＋ 新增</button>
    </div>
    <div class="filters" id="filters">
      <select id="fMonth"><option value="">全部月份</option></select>
      <select id="fTag" class="only-happy only-words"><option value="">全部标签</option></select>
      <select id="fMood" class="only-mood"><option value="">全部情绪</option></select>
      <button class="soft" id="btnBackupOne">导出本模块</button>
    </div>
    <div class="list" id="list"></div>
    <div class="loadmore-wrap"><button class="soft hidden" id="btnMore">显示更多</button></div>
  </section>

  <!-- 备份 -->
  <section class="view" id="view-backup">
    <div class="panel">
      <h2>全部备份</h2>
      <p class="hint">三个模块一起导出为一个 JSON 文件，包含图片。建议每月做一次。</p>
      <div class="actions">
        <button class="primary" id="btnExportAll">导出全部数据</button>
        <button class="soft" id="btnExportMd">导出为 Markdown</button>
      </div>
    </div>

    <div class="panel">
      <h2>单模块备份</h2>
      <div class="grid3">
        <button class="soft" data-export="happy">导出幸福收藏</button>
        <button class="soft" data-export="words">导出西格的话</button>
        <button class="soft" data-export="mood">导出心情花笺</button>
      </div>
    </div>

    <div class="panel">
      <h2>恢复数据</h2>
      <p class="hint">支持新版全部备份、单模块备份，以及旧版 v4 备份文件。导入前会显示摘要。</p>
      <div class="field">
        <label class="row"><input type="checkbox" id="replaceMode"> 替换同名模块的现有数据（默认是合并去重）</label>
      </div>
      <div class="actions">
        <label class="btn-file primary">选择备份文件<input type="file" id="fileImport" accept=".json,application/json"></label>
      </div>
      <div id="importResult" class="result"></div>
    </div>

    <div class="panel">
      <h2>旧数据检查</h2>
      <p class="hint">旧网站的记录使用同一个数据库，新版本会直接沿用，不需要手动迁移。下面是读取到的数量。</p>
      <div class="actions"><button class="soft" id="btnCheckLegacy">检查旧数据</button></div>
      <div id="legacyResult" class="result"></div>
    </div>
  </section>

</main>

<footer class="site-footer wrap">
  <p>紫藤花语 · 只存在你这台设备上</p>
</footer>

<!-- 编辑弹层 -->
<div class="overlay hidden" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">新增</h2>
      <button class="icon" id="btnClose" aria-label="关闭">×</button>
    </div>
    <form id="form" class="sheet-body"></form>
    <div class="sheet-foot">
      <button type="button" class="soft" id="btnCancel">取消</button>
      <button type="submit" form="form" class="primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
